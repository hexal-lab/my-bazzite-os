name: my-bazzite-os
description: Hyprland build for Alienware RTX 3060

base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  - type: rpm-ostree
    install:
      - hyprland
      - kitty
      - waybar
      - rofi-wayland
      - thunar
      - fish
      - nvidia-vaapi-driver


  - type: signing # this sets up the proper policy & signing files for signed images to work fully
